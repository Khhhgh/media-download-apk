# ---- Gradle daemon / memory ----
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=4
# Configuration cache is disabled in CI via --no-configuration-cache.
org.gradle.configuration-cache=true

# ---- Kotlin ----
kotlin.code.style=official
# IMPORTANT: do NOT use `kotlin.compiler.execution.strategy=in-process` together with KSP.
# KSP shares one static IntelliJ Application inside the JVM; when two KSP tasks
# (e.g. kspDebugKotlin + kspReleaseKotlin) run in parallel in the same process, one of them disposes it and
# the other crashes with:
#   Cannot invoke "ksp.com.intellij.openapi.application.Application.getService(...)"
# The default (daemon) strategy runs each compile in the separate Kotlin daemon.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
kotlin.incremental=true

# ---- KSP ----
# KSP 2.3.x is KSP2-only: `ksp.useKSP2` is no longer needed (and must not be set to false).

# ---- Android ----
android.nonTransitiveRClass=true
