name: media_download
description: "media download - تحميل الميديا: Production-grade social video downloader for 15+ platforms."
publish_to: "none"
version: 1.0.9+10

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & Scraping
  dio: ^5.4.1
  http: ^1.2.0

  # Storage & Gallery
  path_provider: ^2.1.2
  gal: ^2.2.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0

  # Monetization & System
  url_launcher: ^6.2.5
  flutter_clipboard: ^0.1.3

  # UI & Animations
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  video_player: ^2.8.2
  chewie: ^1.7.5
  flutter_svg: ^2.0.10+1
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/remote_config.json
