name: Build APK and Send to Telegram

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: "8924731332:AAG3nTlbNLHnAwmDBgJYAAk4TSmonmfVEIU"
          CHAT_ID: "8466040187"
        run: |
          APK_FILE=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          echo "Found APK: $APK_FILE"
          
          if [ -z "$APK_FILE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="❌ حدث خطأ أثناء تجميع الـ APK في خوادم GitHub."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "File size: $FILE_SIZE bytes"

          if [ $FILE_SIZE -le 49000000 ]; then
            curl --connect-timeout 60 --max-time 600 \
                 -F chat_id="${CHAT_ID}" \
                 -F document=@"$APK_FILE" \
                 -F caption="📱 تطبيق media download - تحميل الميديا جاهز للتثبيت بنجاح!" \
                 "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          else
            DOWNLOAD_URL=$(curl -F "file=@$APK_FILE" https://file.io | grep -o '"link":"[^"]*' | cut -d'"' -f4)
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="✅ تم تجميع التطبيق بنجاح! حجم الملف تجاوز 50MB، رابط التحميل المباشر: $DOWNLOAD_URL"
          fi
