name: Build APK and Send to Telegram

on:
  push:
    branches: [ main, master ]
    # تجاهل تعديلات المحركات الهوائية لكي لا يُعاد بناء الـ APK وإرساله عشوائياً
    paths-ignore:
      - 'downapp/**'
      - 'tools/**'
      - '**.md'
      - 'promt.txt'
      - '.gitignore'
      - 'metadata.json'
  workflow_dispatch:

# إلغاء أي بناء قيد التشغيل فوراً إذا تم رفع تعديل جديد لمنع تراكم وتكرار الإرسال
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python 3.12 (Chaquopy build interpreter)
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        continue-on-error: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Configuration and Warnings
        run: |
          find . -type f \( -name "*.kts" -o -name "*.gradle" \) -exec sed -i 's/allWarningsAsErrors\s*=\s*true/allWarningsAsErrors = false/g' {} + || true
          find . -type f \( -name "*.kts" -o -name "*.gradle" \) -exec sed -i 's/allWarningsAsErrors.set(true)/allWarningsAsErrors.set(false)/g' {} + || true
          find . -type f \( -name "*.kts" -o -name "*.gradle" \) -exec sed -i 's/"-Werror"//g' {} + || true

          python3 - << 'EOF'
          import os, re, json

          packages = set(["com.example", "com.example.app", "com.example.mediadownload"])
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".kts", ".gradle")):
                      try:
                          content = open(os.path.join(root, f), errors="ignore").read()
                          matches = re.findall(r'(?:namespace|applicationId)\s*=?\s*["\']([^"\']+)["\']', content)
                          packages.update(matches)
                          pkg_matches = re.findall(r'package\s+([a-zA-Z0-9_.]+)', content)
                          packages.update(pkg_matches)
                          manifest_matches = re.findall(r'package=["\']([^"\']+)["\']', content)
                          packages.update(manifest_matches)
                      except:
                          pass

          clients = []
          for pkg in packages:
              if pkg and not pkg.startswith("android.") and not pkg.startswith("androidx.") and not pkg.startswith("java."):
                  clients.append({
                      "client_info": {
                          "mobilesdk_app_id": f"1:123456789012:android:{abs(hash(pkg))%10000000000000000}",
                          "android_client_info": {"package_name": pkg}
                      },
                      "oauth_client": [],
                      "api_key": [{"current_key": "dummy_api_key"}],
                      "services": {"analytics_service": {"status": 1}}
                  })

          dummy = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "media-download-app",
                  "storage_bucket": "media-download-app.appspot.com"
              },
              "client": clients,
              "configuration_version": "1"
          }

          for dest in ["app/google-services.json", "app/src/debug/google-services.json", "app/src/main/google-services.json", "google-services.json"]:
              os.makedirs(os.path.dirname(dest) or ".", exist_ok=True)
              with open(dest, "w") as fp:
                  json.dump(dummy, fp, indent=2)
          print(f"Generated google-services.json for {len(clients)} packages")
          EOF

          sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties 2>/dev/null || true
          cat << 'EOF' >> gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true
          org.gradle.configuration-cache=false
          ksp.incremental=false
          ksp.run.in.separate.process=true
          EOF

      - name: Build Debug APK
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Send APK to Telegram
        shell: python
        run: |
          import os, glob, urllib.request

          apk_files = glob.glob("app/build/outputs/apk/**/*.apk", recursive=True)
          if not apk_files:
              print("No APK found!")
              raise SystemExit(1)

          apk_path = apk_files[0]
          size_mb = os.path.getsize(apk_path) / (1024 * 1024)
          print(f"Sending APK ({size_mb:.2f} MB)...")

          token = "7956531264:AAF5-8IfFQ63265lqke2fS0PUAS8Ka7aaXU"
          chat_id = "8466040187"
          url = f"https://api.telegram.org/bot{token}/sendDocument"

          boundary = "----WebKitFormBoundary7MA4YWxkTrZu0gW"
          with open(apk_path, "rb") as f:
              file_data = f.read()

          body = bytearray()
          body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name="chat_id"\r\n\r\n{chat_id}\r\n'.encode('utf-8'))
          body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name="caption"\r\n\r\n📱 تطبيق media download ({size_mb:.1f} MB) - جاهز للتثبيت بنجاح!\r\n'.encode('utf-8'))
          body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name="document"; filename="{os.path.basename(apk_path)}"\r\nContent-Type: application/vnd.android.package-archive\r\n\r\n'.encode('utf-8'))
          body.extend(file_data)
          body.extend(f'\r\n--{boundary}--\r\n'.encode('utf-8'))

          req = urllib.request.Request(url, data=bytes(body), headers={'Content-Type': f'multipart/form-data; boundary={boundary}'})
          with urllib.request.urlopen(req, timeout=180) as response:
              print(response.read().decode('utf-8'))
          print("APK Sent successfully!")
