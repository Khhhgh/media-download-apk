name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'metadata.json'
      - 'promt.txt'
      - 'flutter_source/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'release'
          - 'debug'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-detect Project Root
        run: |
          # If the repository was pushed inside a subfolder (e.g. media-download-apk-main)
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "./.git/*" | head -n1 | xargs -r dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Detected Android project inside: $SUBDIR. Moving contents to root..."
              shopt -s dotglob
              mv "$SUBDIR"/* . || true
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Ensure Gradlew & Clean Line Endings
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing -> generating Gradle 9.3.1 wrapper"
            TMP=$(mktemp -d)
            touch "$TMP/settings.gradle"
            (cd "$TMP" && gradle wrapper --gradle-version 9.3.1 --distribution-type bin --no-daemon)
            mkdir -p gradle/wrapper
            cp -n "$TMP/gradlew" "$TMP/gradlew.bat" . || true
            cp -f "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
              cp "$TMP/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
            fi
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Prepare Secrets & Environment
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Restore or Generate Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for signing..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          ls -lh debug.keystore

      - name: Build APK with Gradle
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          echo "Building target: $BUILD_TYPE"

          # Run build tasks sequentially to prevent KSP concurrency and daemon crashes
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "==> Building assembleDebug..."
            ./gradlew assembleDebug --no-configuration-cache --no-parallel --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            echo "==> Building assembleRelease..."
            ./gradlew assembleRelease --no-configuration-cache --no-parallel --stacktrace
          else
            echo "==> Building assembleDebug..."
            ./gradlew assembleDebug --no-configuration-cache --no-parallel --stacktrace
            echo "==> Building assembleRelease..."
            ./gradlew assembleRelease --no-configuration-cache --no-parallel --stacktrace
          fi

      - name: Organize & Package APK Outputs
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_NAME=${VERSION_NAME:-1.0.0}
          mkdir -p dist

          echo "Searching for APK files in app/build/outputs/apk/..."
          find app/build/outputs/apk -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            echo "Found APK: $apk"
            cp "$apk" "dist/$filename"
            if [[ "$filename" == *"release"* ]]; then
              cp "$apk" "dist/MediaDownloader-v${VERSION_NAME}-release.apk"
            elif [[ "$filename" == *"debug"* ]]; then
              cp "$apk" "dist/MediaDownloader-v${VERSION_NAME}-debug.apk"
            fi
          done

          echo "APK outputs in dist/:"
          ls -lh dist/

          {
            echo "### 📱 Build Summary (v${VERSION_NAME})"
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in dist/*.apk; do
              [ -f "$f" ] && echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-APKs
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload KSP / build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/**/ksp/**/*.log
          if-no-files-found: ignore
          retention-days: 7
